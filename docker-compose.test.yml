services:
  postgres-test:
    image: postgres:17-alpine
    restart: 'no'
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-stockflow_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-stockflow_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-stockflow_test}
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-5434}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${TEST_POSTGRES_USER:-stockflow_test} -d ${TEST_POSTGRES_DB:-stockflow_test}',
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
